# Test tooling exported by tools/export-from-workspace.sh into tests/<name>/.
# One test per line, fields separated by " | ":
#   name     directory under tests/
#   sources  files under ~/orangepi5/work/_out (space-separated; globs allowed; text only)
#   where    where it runs: board, host, or both
#   topic    topic directory with the detailed notes ("-": none)
#   title    one line
#   run      how it was run, as one shell line (shown in the README)
# Lab-specific values (board login, host address, home directory) become
# overridable defaults through .work/private/tests-public.conf; see the README of each test.
modesweep | modesweep/modesweep.sh modesweep/dpslow.sh | board | vop2-underflow-int | Display mode sweep: every mode on every connector, with and without a full-screen NV12 overlay, every plane format; counts VOP2 underflows | nohup sudo bash ~/modesweep/modesweep.sh > ~/modesweep/run.log 2>&1 &
codec-sweep | codec-quality/codecsweep.sh codec-quality/vqcmp.sh codec-quality/scripts/*.sh codec-quality/scripts/*.py | board | codec-quality | Codec sweep: every codec x resolution x frame rate on every hardware decoder (bit-exact vs FFmpeg), every encoder (PSNR), v4l2-compliance, fluster | nohup sudo bash ~/codecsweep/codecsweep.sh > ~/codecsweep/run.log 2>&1 &
netstress | netstress/netstress.sh netstress/rangeserver.py | both | - | Network streaming stress: two 4K HTTP streams decoded and shown on HDMI + DP, plus a 400 Mbit/s HEVC Main10 decode over HTTP | host: python3 -I rangeserver.py $OPI5_HOST_IP 8099 <media dir>; board: bash ~/netstress/netstress.sh http://$OPI5_HOST_IP:8099 30
demo | demo/demo.sh | board | - | Live decode / encode-and-play demo of every video block | bash ~/demo/demo.sh list
maxout | maxout/maxout.sh maxout/stream.py maxout/tools/rkvenc-enc.c maxout/ddrbw.c maxout/npu_analyze.py maxout/copy-agg.sh maxout/cam-record.sh maxout/scratch-setup.sh maxout/toggle-torture.sh maxout/hotplug.sh maxout/hotplug-sim.sh maxout/repro-restart.sh maxout/soup-race.sh | board | - | Everything at once: two HTTP streams on two displays with NPU analysis, VEPU580 encode, 4K webcam recording to rotating segments, three-disk checksummed copy aggregator, GPU load, thermal/DDR/IRQ monitoring; plus open/close torture and hot-unplug tests | bash ~/maxout/maxout.sh 900
dp-smooth | dp-smooth/tools/*.sh dp-smooth/tools/*.py dp-smooth/tools/*.c | board | dp-smooth | KMS frame-cadence measurement tools for HDMI and USB-C DP (plain kmssink needs no wrapper since patches/gstreamer 0003-0008) | tools/cadence.py
vop2-underflow | vop2-underflow/tools/*.sh vop2-underflow/tools/*.c vop2-underflow/tools/*.py | board | vop2-underflow-int | VOP2 underflow test matrix: planetest (planes x formats x modes) under memory/bus load, underflow and IRQ counting | sudo bash runtest.sh <label> <planetest args>
rkvdec-ccu | rkvdec-ccu/scripts/ccu-verify.sh rkvdec-ccu/scripts/ccu-lib.sh rkvdec-ccu/scripts/fluster.sh rkvdec-ccu/scripts/baseline.sh | board | rkvdec-ccu | rkvdec CCU (one stream on both decoder cores): bit-exactness, fps A/B, two-stream and fluster runs. Needs the in-progress rkvdec-ccu kernel, not the image kernel | bash ~/ccu/ccu-verify.sh
va-driver | browser-hwdec/board-bundle/run-tests.sh | board | - | VA-API driver (libva-v4l2_request) board test: probe, correctness vs FFmpeg, fluster, performance, GStreamer va | ./run-tests.sh probe correct perf gst
audio | audio/listen-test.sh audio/modeswitch-listen.sh audio/seq.sh | board | audio | Audible output checks: HDMI, USB-C DP and the headphone jack, and HDMI audio across FRL/TMDS mode changes | bash listen-test.sh all
queue | queue/queue.sh | board | - | Unattended board test queue (CCU verify + fluster, codec-quality fluster, VA driver tests) | nohup bash ~/queue/queue.sh > ~/queue/run.log 2>&1 &
k3-validation | k3-validation/run-k3.sh | host | - | The host-driven unattended install + validation run used for kernel build 3 (reference; adapt the paths) | nohup tests/k3-validation/run-k3.sh > run.log 2>&1 &
tcpm | tcpm/tools/discovery-cycle.sh tcpm/tools/install-tcpm.sh | board | tcpm | USB-C dock attach/detach cycles: DP alt-mode discovery outcome, VDM timeouts and USB re-enumeration per cycle | sudo bash discovery-cycle.sh 100 <outdir>
suspend | suspend/tools/s2idle-cycles.sh suspend/tools/susp-run.sh suspend/tools/susp-check.sh suspend/tools/bisect-attempt.sh suspend/tools/rtc-set.py suspend/tools/resume-wd/resume_wd.c suspend/tools/resume-delay/resume_delay.c | board | suspend | Suspend/resume: RTC-alarm s2idle cycles with post-resume checks (USB3, DP, HDMI, SATA, network), resume watchdog and per-device resume-delay bisect modules | sudo bash s2idle-cycles.sh 50
usb3-port | usb3-port/check-usb3-port.sh | board | usb3-port | Type-A USB3 port: speed of each device at boot vs after replug | bash check-usb3-port.sh
