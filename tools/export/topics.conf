# Kernel topics exported by tools/export-from-workspace.sh into topics/<name>/
# and recreated as branches by tools/recreate-kernel-branches.sh.
#
# One topic per line, fields separated by " | ":
#   name      directory under topics/ (and branch opi5/<name> in the kernel fork)
#   branch    branch in the workspace kernel clone (~/orangepi5/src/linux)
#   parent    what the topic sits on: another topic's name, or v7.3 / c339f4010
#             (the topic's commits are merge-base(branch, parent)..branch)
#   out       directory under ~/orangepi5/work/_out with the topic's notes ("-": none)
#   title     one line
#   hw        hardware-test state (free text, as of the date in STATUS.md)
#   next      next step towards upstream
#   publish   optional 8th field. Default: branch opi5/<name> in the kernel fork.
#             "tag:<tag>": no branch; an annotated tag <tag> at the recreated tip
#             instead. Used for retired integration stacks that other topics
#             still sit on (archive/<name>, image-<kernel version>).
# Topic order matters: parents come before their children.
#
# The image kernel itself (v7.3 + patches/linux) is not a topic: it is recreated
# as branch opi5/image plus tag image-<version> (version = KDEB_PKGVERSION in
# scripts/build-kernel.sh), and image-<version>-extra (+ patches/linux-extra).
#
# Retired branches (tips kept as tags in the fork, no longer generated):
#   opi5/rkvdec-ccu-base -> archive/rkvdec-ccu-base, opi5/dw-dp-redetect -> archive/dw-dp-redetect,
#   opi5/integration -> archive/integration, opi5/image-k6 -> image-7.3.0-6,
#   opi5/image-k7 -> image-7.3.0-7, opi5/image-7.3 -> image-7.3.0-8, opi5/image-7.3-extra -> image-7.3.0-8-extra
#
