# Kernel topics exported by tools/export-from-workspace.sh into topics/<name>/
# and recreated as branches by tools/recreate-kernel-branches.sh.
#
# One topic per line, fields separated by " | ":
#   name      directory under topics/ (and branch opi5/<name> in the kernel fork)
#   branch    branch in the workspace kernel clone (~/orangepi5/src/linux)
#   parent    what the topic sits on: another topic's name, or v7.3 / c339f4010
#             (the topic's commits are merge-base(branch, parent)..branch)
#   out       directory under ~/orangepi5/work/_out with the topic's notes ("-": none)
#   title     one line
#   hw        hardware-test state (free text, as of the date in STATUS.md)
#   next      next step towards upstream
# Topic order matters: parents come before their children.
#
# Special parent/branch "@boardbase": the Orange Pi 5 SATA DTS commit that most
# v7.3 board branches share (merge-base of the board branches listed in BOARDBASE).
BOARDBASE=opi5/dsi-7.3 opi5/iep2-7.3 opi5/rkjpegd-7.3 opi5/gpu-npu-7.3 opi5/board-hygiene-7.3

