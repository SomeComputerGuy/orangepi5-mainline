SectionDevice."HDMI1" {
	Comment "HDMI"

	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId}"
	}
}

If.dp {
	Condition {
		Type RegexMatch
		Regex "^dp[0-9]$"
		String "${CardName}"
	}
	True.SectionDevice."HDMI1" {
		Comment "DisplayPort"
		Value.PlaybackPriority 140
	}
}
