# First-boot config comes from the FAT partition labelled CIDATA on the SD card
datasource_list: [ NoCloud, None ]
# Server: there is no logind seat over SSH or on the serial console, so the
# default user (ubuntu) gets the sound cards, video decoders and GPU render
# node through groups. Ubuntu's defaults are adm, cdrom, dip, lxd, sudo.
# The desktop image overrides this list in 91-opi5-desktop.cfg and leaves
# audio to logind's seat ACLs (uaccess), which PipeWire relies on.
system_info:
  default_user:
    groups: [adm, cdrom, dip, lxd, sudo, audio, video, render]
