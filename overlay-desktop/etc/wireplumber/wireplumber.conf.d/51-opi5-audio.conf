# Orange Pi 5 on-board sound cards. ACP calls every platform card "Built-in
# Audio" and gives all of their sinks the same session priority, so the
# default output would depend on probe order. Name them, and rank the
# headphone jack above HDMI above USB-C DP: the headphone sink only exists
# while something is plugged in (jack detection), so plugging headphones in
# makes them the default and unplugging falls back to the display.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-analog-sound" } ]
    actions = { update-props = { device.description = "Headphone Jack" } }
  }
  {
    matches = [ { device.name = "alsa_card.platform-hdmi0-sound" } ]
    actions = { update-props = { device.description = "HDMI" } }
  }
  {
    matches = [ { device.name = "alsa_card.platform-dp0-sound" } ]
    actions = {
      update-props = {
        device.description = "USB-C DisplayPort"
        device.icon-name = "video-display"
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-analog-sound.*" } ]
    actions = { update-props = { node.description = "Headphones", priority.session = 1100 } }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-analog-sound.*" } ]
    actions = { update-props = { node.description = "Microphone" } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-hdmi0-sound.*" } ]
    actions = { update-props = { node.description = "HDMI", priority.session = 1000 } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-dp0-sound.*" } ]
    actions = { update-props = { node.description = "USB-C DisplayPort", priority.session = 900 } }
  }
]
