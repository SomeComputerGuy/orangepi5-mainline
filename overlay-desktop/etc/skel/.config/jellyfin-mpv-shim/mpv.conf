# mpv options for Jellyfin MPV Shim (read in addition to its own defaults).
# A top-level hwdec here "pins" the decoder: the app then never changes it.
# v4l2request = the RK3588 V4L2 stateless decoders via FFmpeg, with the DRM
# PRIME (dmabuf) frames imported into the GPU without copies; anything the
# hardware can't decode falls back to software.
hwdec=v4l2request
# EGL dmabuf import (Mesa panthor); try Vulkan (panvk) with gpu-api=vulkan
gpu-api=opengl
