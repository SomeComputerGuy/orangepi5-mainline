# Desktop: the default user (ubuntu) gets Ubuntu's own default groups. At the
# desktop, logind's seat ACLs (uaccess) grant the sound cards, the video
# decoders and the GPU render node, as on any Ubuntu desktop; this undoes the
# server's extra audio/video/render groups from 90-opi5.cfg.
system_info:
  default_user:
    groups: [adm, cdrom, dip, lxd, sudo]
